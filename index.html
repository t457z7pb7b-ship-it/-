<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>長文・知らない単語テスト</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f2f5fa;color:#17233a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{padding-bottom:82px}
main{max-width:760px;margin:auto;padding:10px 14px 24px}
.card{background:#fff;border-radius:24px;padding:22px;margin:10px 0;box-shadow:0 2px 12px rgba(30,50,80,.055)}
.hero h1{font-size:27px;margin:0 0 13px;letter-spacing:-.5px}
.hero p{font-size:17px;line-height:1.65;color:#687a98;margin:0}
h2{font-size:23px;margin:0 0 18px}
h3{font-size:20px;margin:20px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#f5f7fb;border-radius:21px;text-align:center;padding:14px 4px}
.stat .label{font-size:15px}
.stat .num{font-size:34px;font-weight:800;margin-top:2px}
.rank{border:2px solid #e3e7ef;border-radius:18px;padding:11px 12px;margin:8px 0;display:flex;align-items:center;gap:8px;min-height:54px}
.rank .name{font-size:17px;font-weight:800;flex:1;min-width:0}
.rank .meaning{font-weight:500;color:#61728f}
.rank .result{background:#fff0ee;color:#d83b30;border-radius:14px;padding:6px 8px;font-size:13px;white-space:nowrap}
button,input,select,textarea{font:inherit}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid #dce2eb;border-radius:13px;background:#fff;font-size:16px;margin:4px 0}
textarea{min-height:95px}
button{border:0;border-radius:13px;padding:11px 15px;background:#e8ecf2;color:#17233a;font-weight:700;margin:4px 3px 0 0}
button.primary{background:#17233a;color:#fff}
button.danger{background:#fff0ee;color:#d83b30}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:#71809a;font-size:13px;line-height:1.5}
.list{border:1px solid #e0e5ed;border-radius:16px;overflow:hidden;max-height:560px;overflow-y:auto;background:#fff}
.word{padding:14px 13px;border-bottom:1px solid #e8ebf0}
.word:last-child{border-bottom:0}
.wordtop{display:flex;justify-content:space-between;gap:10px}
.worden{font-size:17px;font-weight:800}
.wordja{font-size:15px;color:#526683;margin-top:4px}
.wordstat{font-size:12px;color:#77859b;margin-top:5px}
#quiz{display:none}
.q{font-size:34px;font-weight:800;text-align:center;padding:65px 8px 22px;word-break:break-word}
.a{min-height:40px;text-align:center;font-size:21px;margin-bottom:20px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;height:74px;background:rgba(255,255,255,.96);border-top:1px solid #dce2ea;display:grid;grid-template-columns:repeat(4,1fr);z-index:20}
.navbtn{border:0;background:transparent!important;border-radius:0!important;margin:0!important;padding:7px 0!important;color:#71809a!important;font-weight:500!important;font-size:12px}
.navbtn .icon{display:block;font-size:25px;line-height:29px}
.navbtn.active{color:#1769e0!important}
.panel{display:none}
.panel.active{display:block}
@media(max-width:600px){
 main{padding:8px 11px 20px}
 .card{padding:20px 17px;border-radius:23px}
 .hero h1{font-size:25px}
 .hero p{font-size:17px}
 h2{font-size:22px}
 .rank .name{font-size:16px}
 .rank .result{font-size:12px}
 .q{font-size:30px}
}
</style>
</head>
<body>
<main>
<section id="homePanel" class="panel active">
<div class="card hero">
<h1>📚 長文・知らない単語テスト</h1>
<p>長文で出会った知らない単語を追加して、自分専用の単語帳＆テストにできます。</p>
</div>

<div class="card">
<h2>📊 苦手単語管理</h2>
<div class="stats">
<div class="stat"><div class="label">登録単語</div><div class="num" id="total">259</div></div>
<div class="stat"><div class="label">苦手</div><div class="num" id="weak">0</div></div>
<div class="stat"><div class="label">総回答</div><div class="num" id="answered">0</div></div>
</div>
<h3>苦手度ランキング</h3>
<div id="ranking"></div>
</div>

<div class="card">
<h2>😟 苦手管理</h2>
<button style="width:100%;text-align:left" onclick="showPanel('listPanel')">▣　苦手単語を一覧表示　　›</button>
</div>
</section>

<section id="listPanel" class="panel">
<div class="card">
<h2>📖 登録単語一覧 <span id="count">259語</span></h2>
<input id="search" placeholder="単語・意味を検索" oninput="renderList()">
<div id="list" class="list"></div>
</div>
</section>

<section id="testPanel" class="panel">
<div class="card">
<h2>📝 単語テスト</h2>
<div class="row">
<select id="direction"><option value="enja">英語 → 日本語</option><option value="jaen">日本語 → 英語</option></select>
<select id="num"><option value="10">10問</option><option value="20">20問</option><option value="30">30問</option><option value="50">50問</option><option value="100">100問</option><option value="all">全問</option></select>
</div>
<button class="primary" onclick="startTest('all')">テスト開始</button>
<button onclick="startTest('weak')">苦手だけ</button>
<button onclick="startTest('wrong')">間違えた単語</button>
<p class="muted">出題回数の少ない単語を優先して、できるだけ均等に出題します。</p>
</div>
</section>

<section id="settingsPanel" class="panel">
<div class="card">
<h2>➕ 単語を追加</h2>
<input id="newWord" placeholder="英単語">
<input id="newMeaning" placeholder="日本語の意味">
<button class="primary" onclick="addOne()">登録する</button>
<p class="muted">複数登録：1行「英語 | 日本語」</p>
<textarea id="bulk" placeholder="attribute | 属性&#10;attire | 服装"></textarea>
<button onclick="addBulk()">まとめて登録</button>
</div>
<div class="card">
<h2>💾 バックアップ</h2>
<button onclick="exportJSON()">JSONを書き出す</button>
<input type="file" accept=".json" onchange="importJSON(this.files[0])">
</div>
</section>

<section id="quiz" class="panel">
<div class="card">
<div id="progress" class="muted"></div>
<div id="question" class="q"></div>
<div id="answer" class="a"></div>
<button class="primary" onclick="showAnswer()">答えを見る</button>
<button onclick="judge(true)">正解</button>
<button class="danger" onclick="judge(false)">不正解</button>
<button onclick="finishQuiz()">終了</button>
</div>
</section>
</main>

<nav class="bottomnav">
<button id="navHome" class="navbtn active" onclick="showPanel('homePanel')"><span class="icon">⌂</span>ホーム</button>
<button id="navList" class="navbtn" onclick="showPanel('listPanel')"><span class="icon">☷</span>登録単語一覧</button>
<button id="navTest" class="navbtn" onclick="showPanel('testPanel')"><span class="icon">▤</span>テスト</button>
<button id="navSettings" class="navbtn" onclick="showPanel('settingsPanel')"><span class="icon">⚙</span>設定</button>
</nav>

// この版専用の保存領域。
// 以前の「一覧が空になる」保存データを読み込まないようにしています。
const WORD_KEY="longtext_ideal_layout_words_20260921";
const STAT_KEY="longtext_ideal_layout_stats_20260921";

let words=[];
let stats={};
let quiz=[];
let pos=0;
let direction="enja";
let answered=false;

function esc(s){
 return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
 });
}
function escAttr(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,'\\\'');}
function st(w){
 if(!stats[w.id]) stats[w.id]={attempts:0,correct:0,wrong:0};
 return stats[w.id];
}
function save(){
 localStorage.setItem(WORD_KEY,JSON.stringify(words));
 localStorage.setItem(STAT_KEY,JSON.stringify(stats));
}
function load(){
 let sw=null,ss=null;
 try{sw=JSON.parse(localStorage.getItem(WORD_KEY)||"null")}catch(e){}
 try{ss=JSON.parse(localStorage.getItem(STAT_KEY)||"null")}catch(e){}
 words=(Array.isArray(sw)&&sw.length>0)?sw:JSON.parse(JSON.stringify(INITIAL_WORDS));
 stats=(ss&&typeof ss==="object")?ss:JSON.parse(JSON.stringify(INITIAL_STATS));
 words.forEach(st);
 save();
}
function isWeak(w){
 let s=st(w);
 return s.wrong>=2 || (s.attempts>0 && s.wrong/s.attempts>=0.3);
}
function renderHome(){
 document.getElementById("total").textContent=words.length;
 document.getElementById("weak").textContent=words.filter(isWeak).length;
 document.getElementById("answered").textContent=words.reduce((n,w)=>n+st(w).attempts,0);

 let r=words.filter(w=>st(w).attempts>0).sort((a,b)=>{
   let x=st(a),y=st(b);
   return y.wrong/y.attempts-x.wrong/x.attempts || y.wrong-x.wrong;
 }).slice(0,8);

 document.getElementById("ranking").innerHTML=r.length?r.map((w,i)=>{
   let s=st(w),p=Math.round(s.wrong/s.attempts*100);
   return '<div class="rank"><span class="name">'+(i+1)+'. '+esc(w.word)+' <span class="meaning">— '+esc(w.meaning)+'</span></span><span class="result">'+s.attempts+'回　正解 '+s.correct+' / 不正解 '+s.wrong+'</span></div>';
 }).join(""):'<p class="muted">まだ回答履歴がありません。</p>';
}
function renderList(){
 let q=(document.getElementById("search").value||"").toLowerCase();
 let a=words.filter(w=>(w.word+" "+w.meaning).toLowerCase().includes(q));
 document.getElementById("count").textContent=words.length+"語";
 document.getElementById("list").innerHTML=a.length?a.map((w,i)=>{
   let s=st(w);
   return '<div class="word"><div class="wordtop"><span class="worden">'+(i+1)+'. '+esc(w.word)+'</span><button class="danger" onclick="deleteWord(\''+escAttr(w.id)+'\')">削除</button></div><div class="wordja">'+esc(w.meaning)+'</div><div class="wordstat">出題 '+s.attempts+'回 / 正解 '+s.correct+' / 不正解 '+s.wrong+'</div></div>';
 }).join(""):'<p class="muted" style="padding:15px">該当する単語はありません。</p>';
}
function showPanel(id){
 document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));
 let map={homePanel:"navHome",listPanel:"navList",testPanel:"navTest",settingsPanel:"navSettings"};
 if(map[id]) document.getElementById(map[id]).classList.add("active");
 if(id==="homePanel")renderHome();
 if(id==="listPanel")renderList();
 window.scrollTo(0,0);
}
function startTest(kind){
 direction=document.getElementById("direction").value;
 let a=words.slice();
 if(kind==="weak")a=a.filter(isWeak);
 if(kind==="wrong")a=a.filter(w=>st(w).wrong>0);
 if(!a.length)return alert("該当する単語がありません。");
 // 出題回数が少ない単語を優先。回数が同じならランダム。
 a.sort((x,y)=>st(x).attempts-st(y).attempts || Math.random()-.5);
 let n=document.getElementById("num").value;
 quiz=a.slice(0,n==="all"?a.length:Number(n));
 pos=0;
 document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
 document.getElementById("quiz").classList.add("active");
 document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));
 showQuestion();
 window.scrollTo(0,0);
}
function showQuestion(){
 answered=false;
 let w=quiz[pos];
 document.getElementById("progress").textContent=(pos+1)+" / "+quiz.length;
 document.getElementById("question").textContent=direction==="enja"?w.word:w.meaning;
 document.getElementById("answer").textContent="";
}
function showAnswer(){
 let w=quiz[pos];
 document.getElementById("answer").textContent=direction==="enja"?w.meaning:w.word;
 answered=true;
}
function judge(ok){
 if(!answered){showAnswer();return;}
 let s=st(quiz[pos]);
 s.attempts++;
 if(ok)s.correct++;else s.wrong++;
 save();
 pos++;
 if(pos>=quiz.length){alert("テスト終了！");finishQuiz();}
 else showQuestion();
}
function finishQuiz(){
 document.getElementById("quiz").classList.remove("active");
 document.getElementById("homePanel").classList.add("active");
 document.getElementById("navHome").classList.add("active");
 renderHome();
 window.scrollTo(0,0);
}
function addOne(){
 let w=document.getElementById("newWord").value.trim();
 let m=document.getElementById("newMeaning").value.trim();
 if(!w||!m)return alert("英単語と意味を入力してください。");
 if(words.some(x=>x.word.toLowerCase()===w.toLowerCase()))return alert("同じ単語がすでに登録されています。");
 let id="u_"+Date.now()+"_"+Math.random().toString(36).slice(2);
 words.push({id:id,word:w,meaning:m});
 stats[id]={attempts:0,correct:0,wrong:0};
 document.getElementById("newWord").value="";
 document.getElementById("newMeaning").value="";
 save();renderHome();
 alert("登録しました。");
}
function addBulk(){
 let text=document.getElementById("bulk").value.trim();
 if(!text)return;
 let n=0;
 text.split(/\r?\n/).forEach(function(line){
   let p=line.split(/\s*[|\t,]\s*/);
   if(p.length<2)return;
   let w=p[0].trim(),m=p.slice(1).join(" | ").trim();
   if(!w||!m||words.some(x=>x.word.toLowerCase()===w.toLowerCase()))return;
   let id="u_"+Date.now()+"_"+Math.random().toString(36).slice(2);
   words.push({id:id,word:w,meaning:m});
   stats[id]={attempts:0,correct:0,wrong:0};
   n++;
 });
 document.getElementById("bulk").value="";
 save();renderHome();
 alert(n+"語登録しました。");
}
function deleteWord(id){
 if(!confirm("この単語を削除しますか？"))return;
 words=words.filter(w=>w.id!==id);
 delete stats[id];
 save();renderHome();renderList();
}
function exportJSON(){
 let out=words.map(w=>({id:w.id,en:w.word,ja:w.meaning}));
 let blob=new Blob([JSON.stringify({version:9,words:out,stats:stats},null,2)],{type:"application/json"});
 let a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="長文_知らない単語_バックアップ.json";
 a.click();
}
function importJSON(file){
 if(!file)return;
 let r=new FileReader();
 r.onload=function(){
  try{
   let d=JSON.parse(r.result);
   if(!Array.isArray(d.words))throw new Error();
   words=d.words.map(function(w,i){return {
     id:String(w.id||("import_"+i)),
     word:String(w.en??w.word??""),
     meaning:String(w.ja??w.meaning??"")
   }}).filter(w=>w.word);
   stats=d.stats||{};
   words.forEach(st);
   save();renderHome();renderList();
   alert(words.length+"語を読み込みました。");
  }catch(e){alert("JSONの読み込みに失敗しました。");}
 };
 r.readAsText(file);
}
load();
renderHome();
renderList();
